<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
  <title id="title">How a task flows through LES</title>
  <desc id="desc">A request passes through a provider pointer, LES-AGENT.md, the bootstrap, and one skill. R3 work stops at an approval gate. Work is done and verified, looping back to fix defects, and ends in a terminal status that returns to the human.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0f3a3a"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1280" height="520" rx="24" fill="url(#bg)"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <g fill="#111c2e" stroke-width="2.5">
      <rect x="40" y="50" width="210" height="110" rx="14" stroke="#94a3b8"/>
      <rect x="290" y="50" width="210" height="110" rx="14" stroke="#38bdf8"/>
      <rect x="540" y="50" width="210" height="110" rx="14" stroke="#38bdf8"/>
      <rect x="790" y="50" width="210" height="110" rx="14" stroke="#2dd4bf"/>
      <rect x="1040" y="50" width="210" height="110" rx="14" stroke="#2dd4bf"/>
      <rect x="1040" y="310" width="210" height="110" rx="14" stroke="#f59e0b"/>
      <rect x="790" y="310" width="210" height="110" rx="14" stroke="#a3e635"/>
      <rect x="540" y="310" width="210" height="110" rx="14" stroke="#a3e635"/>
      <rect x="290" y="310" width="210" height="110" rx="14" stroke="#5eead4"/>
      <rect x="40" y="310" width="210" height="110" rx="14" stroke="#f59e0b"/>
    </g>
    <g stroke="#94a3b8" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
      <path d="M 252 105 H 286"/>
      <path d="M 502 105 H 536"/>
      <path d="M 752 105 H 786"/>
      <path d="M 1002 105 H 1036"/>
      <path d="M 1145 162 V 306"/>
      <path d="M 1038 365 H 1004"/>
      <path d="M 788 365 H 754"/>
      <path d="M 538 365 H 504"/>
      <path d="M 288 365 H 254"/>
    </g>
    <path d="M 645 424 C 645 484, 895 484, 895 424" stroke="#a3e635" stroke-width="2.5" stroke-dasharray="7 6" fill="none" marker-end="url(#arrow)"/>
    <text x="770" y="506" font-size="14" fill="#a3e635">defect found: fix, then verify again</text>

    <g fill="#f8fafc" font-size="22" font-weight="700">
      <text x="145" y="92">Your request</text>
      <text x="395" y="92">Provider pointer</text>
      <text x="645" y="92">LES-AGENT.md</text>
      <text x="895" y="92">Bootstrap</text>
      <text x="1145" y="92">One skill</text>
      <text x="1145" y="352">Approval gate</text>
      <text x="895" y="352">Do the work</text>
      <text x="645" y="352">Verify</text>
      <text x="395" y="344">Terminal status</text>
      <text x="145" y="352">You decide</text>
    </g>
    <g fill="#cbd5e1" font-size="14">
      <text x="145" y="120">any AI coding CLI</text>
      <text x="395" y="120">AGENTS.md · CLAUDE.md</text>
      <text x="395" y="140">GEMINI.md · agent.md</text>
      <text x="645" y="120">repository entrypoint</text>
      <text x="645" y="140">points to ~/.les-agents</text>
      <text x="895" y="120">precedence · route · risk</text>
      <text x="895" y="140">profile · proof tier</text>
      <text x="1145" y="120">loads only the rules and</text>
      <text x="1145" y="140">workflows it needs</text>
      <text x="1145" y="380">R3 work waits for</text>
      <text x="1145" y="400">explicit human approval</text>
      <text x="895" y="380">smallest safe change</text>
      <text x="895" y="400">inside the approved scope</text>
      <text x="645" y="380">run checks, review the diff</text>
      <text x="645" y="400">fresh proof, not claims</text>
      <text x="395" y="368">COMPLETE · BLOCKED</text>
      <text x="395" y="388">PENDING_USER_ACTION</text>
      <text x="395" y="408">FAILED · SKIPPED</text>
      <text x="145" y="380">approve, answer, and</text>
      <text x="145" y="400">direct the next task</text>
    </g>
  </g>
</svg>
